site_name: Veda Online Documentation
site_description: Documentation for Veda Online — TIMES model management in the browser
site_url: https://kanors-emr.github.io/VedaOnline-documentation/
use_directory_urls: false
docs_dir: docs
site_author: KanORS

repo_url: https://github.com/kanors-emr/VedaOnline-documentation/issues
repo_name: Report a documentation issue
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  logo: images/brand/kanors-logo-white.png
  favicon: images/brand/kanors-favicon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search:
      lang: en

extra_css:
  - _static/custom.css

extra_javascript:
  - _static/image-lightbox.js
  - _static/smooth-anchor.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kanors-emr
      name: KanORS on GitHub
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/playlist?list=PLED97cPMXPOm60xOKSwvmXaGIsQrjoM8Y
      name: KanORS on YouTube
    - icon: fontawesome/solid/globe
      link: https://www.kanors-emr.org/
      name: KanORS website

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 3

copyright: "&copy; KanORS-EMR, 2026"

nav:
  - Home: index.md

  - Getting Started:
    - Overview: Getting-started.md
    - Introduction: introduction.md
    - User Types and Pricing: User-types-and-pricing.md
    - OSeMOSYS in Veda: OSeMOSYS.md
    - Free Academic Access: VO_free_academic.md
    - Comparing Veda online and Veda2.0: Comparing-V2-and-VO.md
    - Account Creation Guide: Registration.md
    - Create Model Guide: Create-Model-Guide.md

  - Model Workspace:
    - Overview: model_workspace/Model-workspace.md
    - Main Menu: 
      - Overview: model_workspace/Veda-Menu.md
      - About Module: model_workspace/About.md
      - Navigator: model_workspace/Navigator.md
      - Browse: model_workspace/Browse.md
      - Items Detail: model_workspace/Items-detail.md
      - Attribute Master: model_workspace/Attribute-Master.md
      - Run Manager: model_workspace/Run-Manager.md
      - Results: model_workspace/Results.md
      - Reports: model_workspace/Reports.md

  - User Account & Tools:
    - Overview: User-account-and-tools.md
    - Email Notifications: Email-notifications.md
    - User Profile: User-Profile.md
    - Model Settings: Models-Settings.md
    - Jobs Dashboard: Jobs-Dashboard.md
    - Import VD Files: Import-Vd-Files.md
    - GDX Diff: Gdx-Diff.md
